<!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
      <link rel="stylesheet" href="assets/css/styles.css">
      <title>Registration Page</title>
   </head>
   <body>
      <div class="login">
         <img src="assets/img/loginbackground.jpg" alt="login image" class="login__img">

         <form action="" class="login__form">
            <h1 class="login__title">Register</h1>
            
            <div class="login__content">
               
                <div class="login__box">
                    <i class="ri-user-3-line login__icon"></i>
    
                    <div class="login__box-input">
                       <input type="text" required class="login__input" id="first-name" placeholder=" ">
                       <label for="first-name" class="login__label"><b>First Name</b></label>
                    </div>
                </div>

                <div class="login__box">
                    <i class="ri-user-3-line login__icon"></i>
    
                    <div class="login__box-input">
                       <input type="text" required class="login__input" id="last-name" placeholder=" ">
                       <label for="last-name" class="login__label"><b>Last Name</b></label>
                    </div>
                </div>
               
                <div class="login__box">
                  <i class="ri-user-3-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="email" required class="login__input" id="login-email" placeholder=" ">
                     <label for="login-email" class="login__label"><b>Email</b></label>
                  </div>
               </div>

               <div class="login__box">
                  <i class="ri-lock-2-line login__icon"></i>

                  <div class="login__box-input">
                     <input type="password" required class="login__input" id="login-pass" placeholder=" " pattern="^(?=.*[a-z])(?=.*[A-Z]).{8,}$" title="Password must be at least 8 characters long and include at least one uppercase and one lowercase letter">
                     <label for="login-pass" class="login__label"><b>Password</b></label>
                     <i class="ri-eye-off-line login__eye" id="login-eye"></i>
                 </div>
                 
               </div>
            </div>

            <button type="submit" class="login__button">Register</button>
            <p><center>Or Sign up with :</center> </p>
            <br>
            <button type="submit" class="loginBtn loginBtn--facebook">Facebook</button>
            <button type="submit" class="loginBtn loginBtn--google">Google</button>
                       
            <p class="login__register"><br>
               Already have an account? <a href="login.html">Login</a>
            </p>
         </form>
      </div>

      <script src="assets/js/main.js"></script>
   </body>
</html>
